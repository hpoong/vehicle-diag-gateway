spring:
  application:
    name: vehicle-diag-gateway
  datasource:
    url: ${GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${GATEWAY_DB_USERNAME:gateway}
    password: ${GATEWAY_DB_PASSWORD:gateway-local}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 10s

diag:
  web:
    problem-type-prefix: 'urn:diag-gateway:error:'

logging:
  pattern:
    level: '%5p [requestId:%X{requestId:-}]'

server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
