services:
  postgres:
    image: postgres:16-alpine
    environment:
      RECEIVER_DB_PASSWORD: ${RECEIVER_DB_PASSWORD:-receiver-local}
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - gateway-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gateway-postgres-data:
